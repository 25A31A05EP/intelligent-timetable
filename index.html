<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Intelligent Timetable System</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>Intelligent Timetable System</h1>
        <p>Timetable Generation & Clash Detection</p>
    </header>

    <section class="dashboard">

        <div class="card">
            <h3>Faculty</h3>
            <p>10</p>
        </div>

        <div class="card">
            <h3>Subjects</h3>
            <p>8</p>
        </div>

        <div class="card">
            <h3>Classrooms</h3>
            <p>6</p>
        </div>

        <div class="card">
            <h3>Clashes</h3>
            <p id="clashCount">0</p>
        </div>

    </section>
<section class="data-section">

    <h2>Master Data</h2>

    <div class="form-box">

        <input type="text" id="facultyName"
               placeholder="Enter Faculty Name">

        <button onclick="addFaculty()">
            Add Faculty
        </button>

    </div>

    <div class="data-list">

        <h3>Faculty List</h3>

        <ul id="facultyList"></ul>

    </div>
<div class="subject-box">

    <h3>Subjects</h3>

    <input type="text"
           id="subjectName"
           placeholder="Enter Subject Name">

    <button onclick="addSubject()">
        Add Subject
    </button>

    <h3>Subject List</h3>

    <ul id="subjectList"></ul>

</div>
</section>
    <section class="controls">

        <button onclick="generateTimetable()">
            Generate Timetable
        </button>

        <button onclick="checkClashes()">
            Check Clashes
        </button>

        <button onclick="clearTimetable()">
            Clear
        </button>

    </section>

    <section class="timetable-section">

        <h2>Generated Timetable</h2>

        <table>

            <thead>
                <tr>
                    <th>Day</th>
                    <th>Time</th>
                    <th>Subject</th>
                    <th>Faculty</th>
                    <th>Room</th>
                </tr>
            </thead>

            <tbody id="timetableBody">
            </tbody>

        </table>

    </section>

    <div id="message"></div>

    <script src="script.js"></script>

</body>

</html>
